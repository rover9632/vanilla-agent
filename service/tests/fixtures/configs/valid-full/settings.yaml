# T1.2 fixture: every section spelled out, plus one ${env:} reference.
provider:
  base_url: https://llm.example.com/v1
  api_key: "${env:VA_T12_PROVIDER_KEY}"
  model_name: vanilla-mini
  temperature: 0.2
  max_tokens: 8192
  top_p: 0.9
  timeout_s: 90 # int widens to float
  retries: 3
  allowed_models: [vanilla-mini, vanilla-max]
limits:
  max_turns: 40
  wall_clock_s: 900
  max_concurrent_runs: 2
  per_user_daily_tokens: 500000
  global_hourly_tokens: 4000000
sandbox:
  memory: 2g
  cpus: 2
  pids_limit: 512
  network_mode: none
  max_live_containers: 4
  idle_ttl_s: 600
  image_tag: "2026.11" # quoted: bare 2026.11 would parse as the float 2026.11
registration:
  open: true
  per_ip_rate: 3
  per_ip_daily: 6
permissions:
  default_mode: plan
  allowed_modes: [default, plan, acceptEdits]
