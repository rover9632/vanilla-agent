[project]
name = "service"
version = "0.1.0"
requires-python = ">=3.12"
# Lower bounds are the versions this project was actually probed against, not the
# oldest that "might work": the streaming-chunk / usage normalization in the agent
# layer (docs/plan.md T4.2) is written against openai 3.51 semantics, so a silently
# resolved 1.x/2.x environment would produce wrong ModelEvents rather than an error.
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "openai>=3.51",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    # starlette's TestClient is built on httpx — required for tests, not a transitive accident.
    "httpx>=0.27",
    "ruff>=0.17.6",
    "mypy>=2.4.1",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "jsonschema>=4.26.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
# pytest-asyncio ships without these set and warns on every run until they are
# (asyncio_mode unset also leaves the fixture loop scope ambiguous). The whole
# service is one asyncio loop, so auto mode + a per-function default scope is
# both the least surprising and the configuration that matches ADR-014.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
