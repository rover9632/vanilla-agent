# 内置工具面（§1.1）：enabled / 限额在这里改；注册表由快照构建（T6.1）。
# 硬上限（timeout/result 字节）是代码常量，本文件只能收紧不能突破。
defaults:
  timeout_s: 60
  max_result_bytes: 65536

tools:
  read_file: { enabled: true }
  list_dir: { enabled: true }
  glob: { enabled: true }
  grep: { enabled: true }
  bash:
    enabled: true
    hard_timeout_s: 300 # 单次执行的硬超时上限（T6.6 并把无网失败翻译成人话）
  http_fetch:
    enabled: true
    # 空 allowlist = 拒绝一切域名（fail closed）。注意 http_fetch 是 host 侧
    # 工具，不受 sandbox.network_mode 约束（§8.4③）——要出网必须在这里
    # 显式列域名，逐条评审。
    allowed_domains: []
  # —— 写类工具：初版整体关闭（T1.5 决策）——
  # 开放注册（§8.11）语境下，第一版让 agent 能读、能想、能问，但不能改
  # workspace 文件。要启用逐工具改 enabled，并配 permissions.yaml 的审批规则。
  write_file: { enabled: false }
  edit_file: { enabled: false }
  delete_file: { enabled: false }
  move_file: { enabled: false }
  # —— 交互 / 元工具 ——
  ask_user: { enabled: true }
  skill_load: { enabled: true }
  task: { enabled: true } # subagent 派生（M10）
  todo_write: { enabled: true }
  enter_plan_mode: { enabled: true }
  exit_plan_mode: { enabled: true }
